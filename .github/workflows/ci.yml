name: CI
on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run mypy --strict src/

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run pytest tests/unit/ -v --cov=src --cov-report=term --cov-fail-under=80

  test-integration:
    runs-on: ubuntu-latest
    continue-on-error: true # Remove once tests/integration/ has tests (Week 2)
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.0
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run pytest tests/integration/ -v
