[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Production-grade RAG system over recent arXiv cs.LG papers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "groq>=0.11",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "gradio>=5.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "langfuse>=2.50",
    "sentry-sdk>=2.62.0",
    "ragas>=0.2",
    "numpy>=1.24,<2.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-httpx",
    "respx",
    "fakeredis",
    "pre-commit",
    # Phase R deps — added via `uv add --dev` when Phase R begins
    # "chunking-evaluation",  # not on PyPI; installed from source in Phase R
    # "mteb",
    # "jupyter",
    # "matplotlib",
    # "seaborn",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["qdrant_client", "qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.uv]
# This machine is macOS x86_64 (Intel). PyTorch dropped x86_64 wheels in 2.3+.
# Constraining resolution to this platform ensures uv picks compatible wheels.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
